# The workspace: two packages in one repository, with one lock file.
#
#   server/    insurance-mcp       the MCP server, the only part that's ever deployed
#   database/  insurance-database  builds the database, loads the data, embeds the text
#
# The database tools connect as the admin role, so they stay off any server. To
# install the server alone:  uv sync --package insurance-mcp --no-dev
# Locally, uv run installs both, through the dev group below.
[project]
name = "insurance-mcp-python"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "insurance-database",
    "insurance-mcp",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]

[tool.uv]
# The root holds settings and tests, not code to install.
package = false

[tool.uv.workspace]
members = ["server", "database"]

[tool.uv.sources]
insurance-database = { workspace = true }
insurance-mcp = { workspace = true }

[tool.ruff]
line-length = 100
# Where our own packages live, so ruff sorts their imports after the libraries.
src = ["server/src", "database/src"]
# Ruff also formats Python examples in Markdown. The examples in docs/ are kept
# short on purpose, so ruff only checks the code.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F: the pycodestyle and pyflakes basics. I: sorted imports.
# UP: modern Python syntax. B: common bugs (bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# One city per line, and hand-written sentences, read better than wrapped ones.
"database/src/insurance_database/generate/reference.py" = ["E501"]
"database/src/insurance_database/generate/planted.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full-data checks load 20 times more data, and the embedding-model checks
# download and run the model, so they only run when asked for
# (uv run pytest -m full_data, or -m embedding_model). A -m on the command line
# replaces this one.
addopts = "--strict-markers -m 'not full_data and not embedding_model'"
markers = [
    "full_data: needs full data, such as the planted demo facts (run with -m full_data)",
    "embedding_model: downloads and runs the embedding model (run with -m embedding_model)",
]
