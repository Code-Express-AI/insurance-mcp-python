[project]
name = "insurance-mcp"
version = "0.1.0"
description = "A secure, read-only MCP server for a fictitious auto insurance claims system, built with FastAPI and PostgreSQL."
authors = [
    { name = "Liam Grossmann" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Ruff also formats Python examples in Markdown. The examples in docs/ are kept
# short on purpose, so ruff only checks the code.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F: the pycodestyle and pyflakes basics. I: sorted imports.
# UP: modern Python syntax. B: common bugs (bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# One city per line, and hand-written sentences, read better than wrapped ones.
"src/insurance_mcp/generate/reference.py" = ["E501"]
"src/insurance_mcp/generate/planted.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full-data checks load 20 times more data, and the embedding-model checks
# download and run the model, so they only run when asked for
# (uv run pytest -m full_data, or -m embedding_model). A -m on the command line
# replaces this one.
addopts = "--strict-markers -m 'not full_data and not embedding_model'"
markers = [
    "full_data: needs full data, such as the planted demo facts (run with -m full_data)",
    "embedding_model: downloads and runs the embedding model (run with -m embedding_model)",
]
