name: CI

# Pushes to main, and pull requests. Running on every push as well would test
# a pull request's branch twice.
on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repo is all these jobs need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other code.
      # Dependabot keeps the pins up to date.
      # persist-credentials: false stops checkout leaving the job's GitHub token
      # in .git/config, where every later step could read it. No step needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # uv installs the Python version from .python-version.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      # The Ubuntu runner has Docker, so Testcontainers works unchanged.
      # GitHub sets CI=true, so a missing Docker fails the run instead of skipping tests.
      - name: Test
        run: uv run pytest

  # The planted demo facts that compare against the random data (the most
  # expensive shop, the busiest adjuster) only mean something on full data.
  # So does the 20-page limit on search_claims: small data has fewer pages.
  full-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked

      - name: Check the planted demo facts and the page limit on full data
        run: uv run pytest -m full_data

  # The embed command and the searches with the real embedding model, on small
  # data. The other jobs never download the model.
  embedding-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked

      # Keep the model (90 MB) between runs, so it's only downloaded again when
      # uv.lock changes. uv.lock pins fastembed, not the model: a new download
      # gets the model's current version from Hugging Face.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('uv.lock') }}

      - name: Embed small data and check the searches
        run: uv run pytest -m embedding_model
