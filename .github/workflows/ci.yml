name: CI

on:
  push:
  pull_request:

# Read-only access to the repo is all these jobs need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other code.
      # Dependabot keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # uv installs the Python version from .python-version.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      # The Ubuntu runner has Docker, so Testcontainers works unchanged.
      # GitHub sets CI=true, so a missing Docker fails the run instead of skipping tests.
      - name: Test
        run: uv run pytest

  # The planted demo facts that compare against the random data (the most
  # expensive shop, the busiest adjuster) only mean something on full data.
  full-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked

      - name: Check the planted demo facts on full data
        run: uv run pytest -m full_data
