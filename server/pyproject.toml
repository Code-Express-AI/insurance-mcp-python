[project]
name = "insurance-mcp"
version = "0.1.0"
description = "A secure, read-only MCP server for a fictitious auto insurance claims system, built with FastAPI and PostgreSQL."
authors = [
    { name = "Liam Grossmann" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
